let musicContext=null,musicGain=null,musicTimer=null,musicRadio=null,musicNotes=[];
function stopRadio(){if(musicTimer!==null)clearInterval(musicTimer);musicTimer=null;musicNotes.forEach(n=>{try{n.stop()}catch{}});musicNotes=[];if(musicRadio)musicRadio.classList.remove('playing');musicRadio=null;if(musicGain){musicGain.disconnect();musicGain=null}}

function activateFurniture(el){const name=furnitureTypes[+el.dataset.type].name;if(name==='window'){el.classList.toggle('birds-visible');return}if(name==='mirror'){el.classList.toggle('shadow-visible');return}if(name==='picture'){el.classList.toggle('swaying');return}if(name==='lamp'){el.classList.toggle('lit');return}if(name!=='radio')return;if(musicRadio===el){stopRadio();return}stopRadio();const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor){document.querySelector('#status').textContent='Для музыки открой игру в браузере с поддержкой звука';return}musicContext=musicContext||new AudioCtor();musicRadio=el;musicContext.resume().then(()=>{if(locationView!=='decorate'||musicRadio!==el)return;musicGain=musicContext.createGain();musicGain.gain.value=.16;musicGain.connect(musicContext.destination);musicRadio=el;el.classList.add('playing');musicPhrase();musicTimer=setInterval(musicPhrase,4480)}).catch(()=>{})}
const viewWithExtras=setView;setView=function(view){if(view!=='decorate')stopRadio();viewWithExtras(view)};const removeWithExtras=removePiece.onclick;removePiece.onclick=()=>{if(selectedFurniture===musicRadio)stopRadio();removeWithExtras()};const resetWithExtras=document.querySelector('#reset-bedroom').onclick;document.querySelector('#reset-bedroom').onclick=()=>{stopRadio();resetWithExtras()};
